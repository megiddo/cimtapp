# Production. `docker compose -f docker-compose.prod.yml up --build` / `make up-prod`.
# Image contents only (no source bind-mounts). Same host ./data as development.
# Set a real CIMT_MASTER_KEY in .env. Google OAuth is required when APP_ENV=production.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "25880:80"
    env_file:
      - path: .env
        required: true
    environment:
      docker: "true"
      APP_ENV: production
      CIMT_MASTER_KEY: ${CIMT_MASTER_KEY:?CIMT_MASTER_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:25880/api/v1/auth/google/callback}
      DATA_DIR: /var/www/cimtapp/data
      APP_URL: ${APP_URL:-http://localhost:25880}
      SESSION_SECURE: "true"
    volumes:
      - ./data:/var/www/cimtapp/data
      - ./.env:/var/www/cimtapp/.env:ro
      - type: tmpfs
        target: /var/www/cimtapp/data/tmp
    working_dir: /var/www/cimtapp/backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
