services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - path: .env
        required: false
    environment:
      docker: "true"
      APP_ENV: ${APP_ENV:-development}
      CIMT_MASTER_KEY: ${CIMT_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      DATA_DIR: /var/www/cimtapp/data
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECURE: ${SESSION_SECURE:-false}
    volumes:
      - ./backend:/var/www/cimtapp/backend
      - ./docs:/var/www/cimtapp/docs
      - cimtapp-data:/var/www/cimtapp/data
      - type: tmpfs
        target: /var/www/cimtapp/data/tmp
    working_dir: /var/www/cimtapp/backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    image: node:22-bookworm
    profiles: ["tools"]
    working_dir: /var/www/cimtapp/frontend
    volumes:
      - .:/var/www/cimtapp
    environment:
      npm_config_update_notifier: "false"

volumes:
  cimtapp-data:
